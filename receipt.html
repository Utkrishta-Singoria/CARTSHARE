<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt | CartShare</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet" media="print">
</head>
<body class="receipt-page">
  <header class="cs-topbar no-print">
    <div class="container py-3 d-flex flex-wrap align-items-center gap-2">
      <a href="index.html" class="me-auto" aria-label="CartShare home"><img src="assets/logo.svg" alt="" class="cs-logo"></a>
      <a href="room.html" class="btn btn-outline-cs btn-sm">Back to room</a>
      <button type="button" class="btn btn-outline-cs btn-sm" id="copyTextBtn">Copy as text</button>
      <button type="button" class="btn btn-cs btn-sm" id="printBtn">Print receipt</button>
    </div>
  </header>

  <main class="container py-4">
    <article class="receipt-paper" id="receipt" aria-live="polite"></article>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3 no-print">
    <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/receipt.js"></script>
</body>
</html>
